name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match the Cloudflare Pages BUN_VERSION env var.
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run test:agent
      - run: bun run test:smoke

