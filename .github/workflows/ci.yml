name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match the Cloudflare Pages BUN_VERSION env var.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run test:smoke

      - name: Link check
        uses: lycheeverse/lychee-action@v2.7.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --no-progress --max-concurrency 4
            --root-dir "${{ github.workspace }}/dist"
            --exclude '^https://femmily\.com'
            './dist/**/*.html'
          fail: true

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
