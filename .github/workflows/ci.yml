name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match the Cloudflare Pages BUN_VERSION env var.
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run test:smoke

      - name: Install lychee
        run: |
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz \
            --output "${RUNNER_TEMP}/lychee.tar.gz"
          tar -xzf "${RUNNER_TEMP}/lychee.tar.gz" -C "${RUNNER_TEMP}"
          install -Dm755 \
            "${RUNNER_TEMP}/lychee-x86_64-unknown-linux-gnu/lychee" \
            "${HOME}/.local/bin/lychee"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Link check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          lychee --no-progress --max-concurrency 4
          --root-dir "${{ github.workspace }}/dist"
          --exclude '^https://femmily\.com'
          './dist/**/*.html'

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
